<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="50%" stop-color="#18182E"/>
      <stop offset="100%" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Decorative radar ring -->
  <circle cx="256" cy="256" r="160" stroke="#6366F1" stroke-width="3" stroke-dasharray="12 12" opacity="0.35" fill="none"/>
  <circle cx="256" cy="256" r="90" stroke="#8B5CF6" stroke-width="2.5" opacity="0.4" fill="none"/>
  
  <!-- Knowledge / Radar Emblem (Target & Open Book Spark) -->
  <g filter="url(#glow)">
    <!-- Main diamond spark / hub compass -->
    <path d="M256 120 L278 220 L378 242 L278 264 L256 364 L234 264 L134 242 L234 220 Z" fill="url(#grad)"/>
    <circle cx="256" cy="242" r="28" fill="#FFFFFF"/>
    <!-- Small orbital node -->
    <circle cx="340" cy="180" r="12" fill="#EC4899"/>
    <circle cx="170" cy="300" r="9" fill="#6366F1"/>
  </g>
</svg>
