<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is intentionally left enabled; inputs use >=16px to avoid iOS focus zoom -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Knowledge & Opportunity Hub | هاب دانش و فرصت‌ها</title>
    <meta
      name="description"
      content="Personal AI-powered knowledge and job opportunity hub collecting Telegram bookmarks, daily news digests, and scored job radar items."
    />
    <meta property="og:title" content="Knowledge & Opportunity Hub | هاب دانش و فرصت‌ها" />
    <meta
      property="og:description"
      content="Personal AI-powered knowledge and job opportunity hub collecting Telegram bookmarks, daily news digests, and scored job radar items."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & iOS Safari meta tags -->
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hub" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />

    <!-- Self-hosted Persian typeface (Vazirmatn) -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <script>
    // Apply the stored theme before first paint to avoid a flash of the wrong palette
    (function () {
      try {
        var stored = localStorage.getItem('hub_theme');
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#F2F2F7');
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
